<body>
<div id="app">
  <div id="stage"></div>
  <section id="menu" class="screen" hidden>
    <div class="menu-card">
      <h1 class="title"><span>Office</span><span>Empire</span></h1>
      <p class="tagline">Xây một văn phòng nhỏ. Tuyển đội ngũ. Ký hợp đồng. Biến startup thành đế chế.</p>
      <div class="menu-actions">
        <button class="btn primary" id="menuContinue" data-act="menuContinue">Tiếp tục công ty</button>
        <button class="btn" data-act="menuNew">Thành lập công ty mới</button>
        <button class="btn ghost" data-act="menuImport">Nhập file save</button>
      </div>
      <p class="menu-foot">Prototype 0.1 · Tiến trình tự lưu trên trình duyệt này</p>
    </div>
  </section>
  <section id="create" class="screen" hidden></section>
  <div id="hud" hidden>
    <header class="topbar"></header>
    <aside class="side"></aside>
    <nav class="dock" aria-label="Quản lý"></nav>
    <section id="sheet" hidden></section>
    <div id="buildbar" hidden></div>
    <div id="popups"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>
